const BP = {"generated_from":"pre-existing (collectible-now) aOa elements","documents":[{"document":"Glossary","standard":"ISO/IEC 11179-4 Formulation of Data Definitions (single concise non-circular statement) with atlas classification as the ISO/IEC 11179-2 classification-scheme analogue. Citation: https://en.wikipedia.org/wiki/ISO/IEC_11179, https://www.iso.org/standard/35346.html","output_format":"Markdown / JSON glossary: one entry per term {term, domain, source symbols, definition}, sorted, deduplicated","completeness":"near-complete","sections":[{"section":"Term inventory (the glossary entries)","populated_by":"AST identifiers (SymbolMeta.Name tokens) + atlas enricher keyword set","extraction":"Collect symbol identifiers from Index.Metadata plus atlas keyword entries (enricher Keywords map); tokenize compound identifiers; deduplicate. Materialized today.","required":true,"fillable_now":"yes"},{"section":"Classification / domain grouping","populated_by":"Atlas enricher: 134 semantic domains, keyword->term->domain O(1) lookup","extraction":"For each term, atlas Lookup(keyword) -> []KeywordMatch{Domain,Term}; group entries under @domain. Directly available from atlas/v1 embedded JSON.","required":true,"fillable_now":"yes"},{"section":"Term->term semantic grouping (synonyms / related terms)","populated_by":"Atlas Terms map (term->keyword list) + learner cohit (CohitKwTerm/CohitTermDomain)","extraction":"Atlas Terms already group keywords under one term name (synonym ring); learner cohit edges add observed co-occurrence. Both pre-exist and are materialized.","required":false,"fillable_now":"yes"},{"section":"Source / provenance (where the term occurs in code)","populated_by":"Index.Tokens (token->[]TokenRef) + FileMeta.Path","extraction":"Resolve Index.Tokens[term] to file_id+line; map file_id via Index.Files to path. Code provenance per entry, materialized today.","required":true,"fillable_now":"yes"},{"section":"Definition (ISO 11179-4 conformant single-statement definition)","populated_by":"Atlas domain/term labels as a SEED only","extraction":"Atlas yields domain + curated keyword cluster seeding a definition; a conformant single, concise, non-circular, singular statement is human-authored (no LLM in hot path).","required":true,"fillable_now":"no"},{"section":"Glossary serializer/writer","populated_by":"NOT built \u2014 no writer exists","extraction":"No Markdown/JSON glossary emitter exists in the tree; the index+atlas+cohit data is materialized but a writer pass must be built (deterministic, no new inputs).","required":true,"fillable_now":"no"}],"gaps":["Definition prose -> human (ISO 11179-4 single-statement; atlas gives only classification + keyword cluster seed)","Acronym disambiguation across domains -> partial/human (atlas returns multiple KeywordMatch for shared keywords; canonical sense may need curation)","Serializer -> build (deterministic emitter over materialized index/atlas/cohit data; does not exist today)"]},{"document":"ADR index + drift detection","standard":"Michael Nygard ADR (Title, Status, Context, Decision, Consequences; Cognitect 2011) with MADR 4.0 metadata superset; adr-NNN sequential-numbering convention. Citation: https://adr.github.io/, https://github.com/adr/madr","output_format":"Markdown ADR index (NNN/title/status/links) + per-ADR Nygard/MADR skeleton + Markdown drift report","completeness":"near-complete","sections":[{"section":"ADR index: number (NNN), title, status, file link","populated_by":"Existing ADR files in repo (.context/decisions/ date-prefixed Markdown)","extraction":"Walk decisions/, parse heading + Status line, build sequential index table. Pure file scan over existing docs; materialized.","required":true,"fillable_now":"yes"},{"section":"Title","populated_by":"Existing ADR file H1 (index) / human (new ADRs)","extraction":"For existing ADRs: first H1. For a new ADR skeleton: human-authored.","required":true,"fillable_now":"yes"},{"section":"Status + supersede graph","populated_by":"Existing ADR Status line + cross-referenced supersede links","extraction":"Parse 'Status:' (proposed/accepted/deprecated/superseded) and 'Superseded by ADR-NNN' links to build the status graph. Derivable from existing docs.","required":true,"fillable_now":"yes"},{"section":"Context (forces / problem statement)","populated_by":"None pre-existing for NEW decisions (human prose)","extraction":"Human-authored narrative; carried verbatim for existing ADRs, empty required section for new skeletons.","required":true,"fillable_now":"no"},{"section":"Decision","populated_by":"None pre-existing (human prose)","extraction":"Human intent; carried for existing ADRs only.","required":true,"fillable_now":"no"},{"section":"Consequences","populated_by":"None pre-existing (human prose)","extraction":"Human-authored; carried for existing ADRs only.","required":true,"fillable_now":"no"},{"section":"Drift detection: decision-vs-implementation divergence","populated_by":"Path-derived layer (FileMeta.Path) ONLY \u2014 NOTE: import-edge half is needs-build","extraction":"For ADRs asserting a structural constraint (e.g. 'domain must not import adapters'), the path-derived layer membership is available now, but the actual import edges to test against are NOT extracted (only countImportSpecs exists). So this check needs the import-edge extractor built before it can fire.","required":false,"fillable_now":"no"},{"section":"Drift: structural-change-since-decision timeline","populated_by":"AST snapshot (now) + git history (NOT wired)","extraction":"Correlating structural changes to decision date needs a git-history adapter; none wired. AST-snapshot half exists; temporal half is a gap.","required":false,"fillable_now":"no"}],"gaps":["Context/Decision/Consequences for NEW ADRs -> human (not derivable from code)","Drift dependency-rule check -> build (requires the import-edge extractor that does not exist; path-derived layers alone cannot detect a violation without the edges)","Drift timeline correlation -> build (git-history adapter not wired)","Index + status/supersede graph ARE fully derivable now from existing ADR files (pure file scan)"]},{"document":"Technology Portfolio Catalog","standard":"TOGAF 9.2 Architecture Content Framework \u2014 Technology Portfolio Catalog (Phase D); metamodel entities Logical/Physical Technology Component, Platform Service (Chapter 31 Content Metamodel). Citation: https://pubs.opengroup.org/architecture/togaf9-doc/arch/chap31.html","output_format":"Catalog table (CSV/JSON rows) keyed by technology component; ArchiMate Technology Layer export or Backstage catalog-info.yaml as machine-readable carriers","completeness":"near-complete","sections":[{"section":"Logical Technology Component \u2014 Name","populated_by":"FileMeta.Language (AST language detection, materialized) + manifest dependencies (manifest reader needs-build)","extraction":"Languages/runtimes from FileMeta.Language across the index are materialized now; frameworks/infra software from manifest 'require'/deps need a manifest reader (none exists). The language subset is fillable now.","required":true,"fillable_now":"partial"},{"section":"Logical Technology Component \u2014 Category / TRM taxonomy classification","populated_by":"Atlas enricher (134 domains) + ecosystem (manifest, needs-build)","extraction":"Coarse category (language runtime / web framework / datastore client) from atlas @domain of the package; full TRM alignment needs an enterprise mapping table. Partial.","required":true,"fillable_now":"partial"},{"section":"Physical Technology Component \u2014 Name","populated_by":"IaC files (Docker/k8s/Terraform) \u2014 data present in-repo, reader needs-build","extraction":"Base images (Dockerfile FROM), k8s container images, Terraform resource types. Data is in-repo but no IaC/config reader exists. Collectible, not collected.","required":true,"fillable_now":"no"},{"section":"Component \u2014 Version","populated_by":"Manifests (go.mod 'go 1.x', dep versions) + IaC image tags \u2014 readers needs-build","extraction":"Runtime version from go.mod, dep versions from lockfile, physical version from image tag. Needs manifest + IaC readers (none exist).","required":true,"fillable_now":"no"},{"section":"Platform Service","populated_by":"External system identity (config connection strings/URLs/broker endpoints) \u2014 config reader needs-build","extraction":"DB/cache/broker/object-store identified from config endpoints + datastore client deps; service type inferable from URL scheme/driver, identity from endpoint. Needs a config reader.","required":false,"fillable_now":"no"},{"section":"Lifecycle status (Current/Target/Retiring)","populated_by":"NOT pipeline-derivable","extraction":"Baseline-vs-target/retirement are governance facts; not in code/manifests. Human.","required":false,"fillable_now":"no"},{"section":"Creation / Review / Retirement date","populated_by":"NOT pipeline-derivable (git first-seen could seed 'adopted' as a proxy via needs-build git adapter)","extraction":"EA governance dates for the technology STANDARD, not code timestamps; review/retirement are human.","required":false,"fillable_now":"no"},{"section":"Standards compliance (vs Technology Standards Catalog)","populated_by":"NOT pipeline-derivable","extraction":"Requires an enterprise Technology Standards Catalog to compare against; none in pipeline. Human/external.","required":false,"fillable_now":"no"},{"section":"Description","populated_by":"Atlas enricher + manifest metadata (partial)","extraction":"Short description from atlas semantic domain and/or manifest package description; otherwise a stub.","required":false,"fillable_now":"partial"},{"section":"Catalog serializer/writer (CSV/JSON/ArchiMate/YAML)","populated_by":"NOT built","extraction":"No catalog writer exists; even the FileMeta.Language rows need an emitter built (deterministic).","required":true,"fillable_now":"no"}],"gaps":["IaC/config reader (Docker/k8s/Terraform + connection strings) -> nce Efficiency, TierArchitecture->Modularity. Deterministic mapping table.","required":false,"fillable_now":"yes"},{"section":"Severity / consequence (impact)","populated_by":"Rule-pack Rule.Severity (Info/Warning/High/Critical) + SignalScore (verified score.go)","extraction":"Use Rule.Severity as the impact axis; SignalScore (per-method density/co-occurrence/clustering) gives a finer magnitude. Materialized.","required":true,"fillable_now":"yes"},{"section":"Current (inherent) rating","populated_by":"Rule-pack Severity x SignalScore","extraction":"Derive an inherent rating band from Severity + SignalScore via a fixed banding table. Deterministic once both present.","required":false,"fillable_now":"yes"},{"section":"Principal (SQALE remediation cost)","populated_by":"Rule-pack finding count x per-rule remediation factor (calibration table needs-build/human)","extraction":"Principal = sum(violations x per-rule remediation minutes). aOa supplies violation COUNT deterministically; the calibration factor is an org constant SQALE requires. Partial.","required":false,"fillable_now":"partial"},{"section":"Interest (ongoing impact)","populated_by":"Complexity counts (materialized) x git churn (needs-build)","extraction":"Proxy = complexity (long_function/nesting) x churn (commit frequency on the symbol). Churn needs git log extraction; indexer.go shells to git for gitTrackedFiles so the MECHANISM exists, but no churn-extraction code does. Partial/needs-build.","required":false,"fillable_now":"partial"},{"section":"Likelihood (ISO 31000)","populated_by":"Git churn proxy (needs-build)","extraction":"Likelihood proxied by churn (hot code = higher). Needs git churn extraction; otherwise human-assigned.","required":false,"fillable_now":"partial"},{"section":"Owner","populated_by":"Git blame on affected line range (needs-build)","extraction":"Top/last-author of the symbol's [start-end] via git blame as candidate owner; mechanism exists in indexer.go, extraction code does not. Formal accountable owner is human.","required":false,"fillable_now":"partial"},{"section":"Existing controls","populated_by":"Test coverage map (coverage report + reader, needs-build + runtime)","extraction":"Presence of tests over the symbol; map a supplied coverage report joined to SymbolMeta range. No coverage parser exists. Build + runtime input.","required":false,"fillable_now":"no"},{"section":"Treatment action / remedy","populated_by":"Rule-pack issue class (partial)","extraction":"Generic templated hint per Rule.ID (e.g. 'extract method' for long_function); the actual treatment decision and effort plan is human.","required":false,"fillable_now":"partial"},{"section":"Residual rating","populated_by":"NOT pipeline-derivable","extraction":"Risk after treatment/controls; needs control-effectiveness assessment. Human.","required":false,"fillable_now":"no"},{"section":"Status / due date / last review date","populated_by":"NOT pipeline-derivable (detection date can seed from git first-seen via needs-build adapter)","extraction":"Workflow state and dates are register-management facts. Human/tracker.","required":false,"fillable_now":"no"},{"section":"Register serializer/writer","populated_by":"NOT built","extraction":"Analyzer produces findings/scores but emits no SQALE/ISO 31000 register document; a writer pass must be built.","required":true,"fillable_now":"no"}],"gaps":["git churn + blame extraction -> build (drives interest, likelihood, owner candidate; git invocation mechanism exists in indexer.go, extraction code does not)","Per-rule SQALE remediation factors -> human/config (calibration table)","Test coverage parser + coverage report input -> build + runtime (existing controls)","Residual rating, status, due date, treatment decision, accountable owner -> human","Register serializer -> build (severity+quality core IS materialized from the verified rule-pack; the deterministic spine is fillable, the governance fields are not)"]},{"document":"CI Quality Gate / Coverage report","standard":"SonarQube quality-gate model (Sonar way: coverage/duplicated-lines/Reliability/Security/Maintainability ratings, new-code focus) with Cobertura XML coverage import. Citation: https://docs.sonarsource.com/sonarqube-server/latest/quality-standards-administration/managing-quality-gates/introduction-to-quality-gates/","output_format":"Cobertura coverage XML join + SonarQube-style quality-gate JSON (pass/fail conditions, actual vs threshold)","completeness":"near-complete","sections":[{"section":"Security / Vulnerabilities rating condition","populated_by":"Security rule-pack (TierSecurity bitmask, verified rules_security.go: command_injection/sql_injection/hardcoded_secret bits 0-9, Critical/High) + attack-surface/PII symbols","extraction":"Aggregate TierSecurity bitmask hits per symbol into a vulnerability count and Sonar security rating. Real deterministic materialized rule-pack \u2014 derivable now.","required":true,"fillable_now":"yes"},{"section":"Reliability / Bugs rating condition","populated_by":"Rule-pack TierQuality bitmask + complexity counts","extraction":"Map TierQuality hits + per-symbol complexity to a bug/reliability count, then to a Sonar A-E rating. Partial: aOa taxonomy is not 1:1 with Sonar's bug ruleset, so rating is an approximation.","required":true,"fillable_now":"partial"},{"section":"Maintainability / Code Smells rating condition","populated_by":"Quality rule-pack (TierQuality) + complexity counts","extraction":"Technical-debt/code-smell count from TierQuality + complexity, mapped to a maintainability rating. Partial: same taxonomy-mismatch caveat.","required":true,"fillable_now":"partial"},{"section":"Duplicated-lines density condition","populated_by":"Code inventory + index (trigram/token machinery present)","extraction":"Compute duplicated-line density across the token index (index already does trigram/token matching). Partial: a duplication metric would reuse tokenization but is not a dedicated output today.","required":true,"fillable_now":"partial"},{"section":"Coverage condition (line/branch % per file & symbol)","populated_by":"Test coverage map (coverage report joined to SymbolMeta ranges) \u2014 reader needs-build, report runtime","extraction":"Parse a supplied Cobertura/Go cover profile and join hit lines to SymbolMeta [start-end]. The AST symbol-range join is the part aOa uniquely enables; the coverage reader is not wired and a report must be supplied. Partial.","required":true,"fillable_now":"partial"},{"section":"New-code scope (differential conditions, 20-line fudge factor)","populated_by":"None pre-existing (needs git diff/blame to delimit 'new code')","extraction":"Sonar gates target NEW code, requiring a git diff/blame; no git adapter wired. Only an overall-code gate is possible without it.","required":true,"fillable_now":"no"},{"section":"Gate result (pass/fail, condition list, actual vs threshold)","populated_by":"Composition of the above metrics","extraction":"Once per-metric values exist, emit Sonar-style gate JSON. Partial: only as complete as inputs \u2014 security is solid now; coverage/duplication need a report/detector; new-code needs git.","required":true,"fillable_now":"partial"},{"section":"Cobertura/Sonar-JSON serializer/writer","populated_by":"NOT built","extraction":"No quality-gate or Cobertura emitter exists; even the materialized security rating needs a writer pass built.","required":true,"fillable_now":"no"}],"gaps":["New-code differential scope + 20-line fudge factor -> build (git diff/blame; no git adapter) \u2014 limits gate to overall-code","Coverage condition -> build + runtime (coverage reader + supplied report; AST symbol-range join is the now-part)","Reliability/Maintainability ratings -> approximation (aOa taxonomy not certified 1:1 with Sonar rulesets)","Serializer -> build","Security/Vulnerability rating IS fully derivable now from the verified TierSecurity bitmask rule-pack"]},{"document":"Dependency/Module Graph","standard":"Directed graph G=(V,E) serialized to GraphML 1.0 (graphdrawing.org) or Graphviz DOT, framed as a C4 Component/Container static dependency view (c4model.com). Citation: https://c4model.com/, https://en.wikipedia.org/wiki/C4_model","output_format":"GraphML 1.0 XML and/or Graphviz DOT; optional Structurizr-DSL / Mermaid for C4 framing","completeness":"skeleton-now","sections":[{"section":"Nodes V (modules/packages/files)","populated_by":"Symbol/code inventory (FileMeta.Path grouped to packages) + path-derived package","extraction":"Enumerate FileMeta entries, group by package directory (Go package = directory), emit one node per package. Node SET is materialized now.","required":true,"fillable_now":"yes"},{"section":"Edges E (directed importer->imported dependency)","populated_by":"Import specs parsed for COUNTING ONLY (countImportSpecs, walker.go) \u2014 edge extraction NOT built","extraction":"CORRECTED: walker.go only counts import_spec nodes (countImportSpecs) to fire a 'too many imports' quality rule. No importer->imported edge is extracted, no graph is constructed, nothing is rendered (the 'layered dependency view' is marketing copy in web/static/app.js). The AST has import_spec nodes (collectible) but they are NOT collected into edges. A package-graph extractor over import_spec targets must be BUILT (deterministic, no new inputs).","required":true,"fillable_now":"no"},{"section":"Edge direction semantics (depends-on)","populated_by":"Import edges (needs-build)","extraction":"Direction = import direction (A imports B => A->B); depends-on, not a call graph. Declared in legend. Blocked on the edge extractor above.","required":true,"fillable_now":"no"},{"section":"Node attributes (layer/group, language, version)","populated_by":"Path-derived layer (materialized) + FileMeta.Language (materialized) + go.mod version (manifest reader needs-build)","extraction":"layer from path prefix, language from FileMeta.Language \u2014 both materialized; version needs a manifest reader. Used rd/74393.html","output_format":"C4-static JSON / Structurizr DSL / Mermaid + DOT clustered subgraphs; layer-grouped node set","completeness":"skeleton-now","sections":[{"section":"Layer definitions (named layers + membership rule)","populated_by":"Path-derived layer (FileMeta.Path)","extraction":"Derive layers from path convention: internal/ports, internal/domain/*, internal/adapters/*, cmd/*, atlas/*. Each package assigned by path prefix (ArchUnit definedBy style). Materialized now.","required":true,"fillable_now":"yes"},{"section":"Components per layer","populated_by":"Code inventory (FileMeta.Path) + SymbolMeta","extraction":"List packages under each layer node; annotate with key exported symbols from SymbolMeta (Kind=type/func, exported name). Materialized now.","required":true,"fillable_now":"yes"},{"section":"Inter-layer dependency edges (allowed direction)","populated_by":"Import edges (NOT extracted) + path-derived layer","extraction":"CORRECTED: aggregating imports to layer granularity is the point of this view, but import edges are not extracted (only countImportSpecs). Path membership is available; the layer->layer edges require the import-edge extractor to be BUILT first.","required":true,"fillable_now":"no"},{"section":"Layer-violation edges (upward / skip dependencies)","populated_by":"Import edges (NOT extracted) + path-derived layer","extraction":"CORRECTED: flagging domain->adapters violations needs the actual import edges, which are not collected. Blocked on the same edge extractor. Needs-build.","required":true,"fillable_now":"no"},{"section":"Component role / responsibility annotation (C4 Component semantics)","populated_by":"FileMeta.Domain (@domain hint) \u2014 partial","extraction":"Attach @domain enricher label as a soft role hint per package; NOT authoritative C4 'responsibility' prose.","required":false,"fillable_now":"partial"},{"section":"Diagram title + legend","populated_by":"Generated metadata","extraction":"Auto title 'Layered/Compone terialized) + breaking-change diff (git, needs-build)","extraction":"The symbol index enumerates affected symbols/signatures; the affected-file/module list is materialized. Joining to a specific CHANGESET needs a git diff (no git adapter wired). Partial.","required":true,"fillable_now":"partial"},{"section":"Risk / impact assessment","populated_by":"Tech-debt/risk rule-pack (analyzer bitmask + complexity, materialized) + security tier + breaking-change diff (git, needs-build)","extraction":"Pre-fill from the deterministic analyzer: security-tier hits + quality/complexity counts on touched symbols. Materialized for the analyzer half; the API-surface breaking-change overlay needs git. Partial.","required":false,"fillable_now":"partial"},{"section":"Testing evidence (test plan + results)","populated_by":"Test coverage map (coverage report + reader, needs-build) for coverage; results need CI (not wired)","extraction":"Which touched symbols are covered can be derived from a coverage report joined to the symbol index (when supplied + reader built); pass/fail results need a CI run record. Partial.","required":true,"fillable_now":"partial"},{"section":"Change ID / Request reference","populated_by":"Git PR/commit SHA \u2014 NO git adapter wired","extraction":"Intended source is commit SHA / PR number; no git adapter exists today, so build-needed. Skeleton emits a placeholder field.","required":true,"fillable_now":"no"},{"section":"Who requested","populated_by":"None pre-existing (git author; no adapter)","extraction":"From originating ticket/commit author; needs git/issue-tracker integration not present.","required":true,"fillable_now":"no"},{"section":"Who reviewed (peer review / approver)","populated_by":"None pre-existing (PR review metadata; no forge adapter)","extraction":"Reviewer/approver from PR review records (GitHub/GitLab); no forge adapter. SOX segregation-of-duties (dev != deployer) also uncheckable.","required":true,"fillable_now":"no"},{"section":"When (request/approval/deploy timestamps)","populated_by":"None pre-existing (commit/CI timestamps; no adapter)","extraction":"From commit dates + CI/CD run records; not wired.","required":true,"fillable_now":"no"},{"section":"Authorization record","populated_by":"None pre-existing (approval workflow / ticket)","extraction":"Lives in the ticketing/CAB system; not derivable from code. Human/external.","required":true,"fillable_now":"no"},{"section":"Rollback / back-out plan","populated_by":"None pre-existing (human-authored prose)","extraction":"Human-authored; skeleton emits an empty required field.","required":true,"fillable_now":"no"},{"section":"Post-implementation review","populated_by":"None pre-existing (runtime verification)","extraction":"Confirming production behavior needs runtime/observability data. Human/runtime.","required":true,"fillable_now":"no"},{"section":"Record serializer/writer","populated_by":"NOT built","extraction":"No change-record emitter exists; the materialized 'what changed'/risk pre-fill needs a writer built.","required":true,"fillable_now":"no"}],"gaps":["Change ID, Who-requested, Who-reviewed/approver, When/timestamps -> build (git + forge PR + CI adapter; NONE wired today)","Segregation-of-duties check -> build (identity from git/CI)","Authorization record + Rollback plan -> human (governance artifacts)","Post-implementation review -> runtime/production verification","Only WHAT (affected symbols), coverage join, and analyzer risk pre-fill are code-derivable now; the SOX who/when/approval spine is entirely a gap -> skeleton, not a complete record"]},{"document":"Data Model (intra-symbol entities/fields/serialization)","standard":"ISO/IEC 11179 Metadata Registry \u2014 Part 3 (registry metamodel, Data Element = Data Element Concept + Value Domain) and Part 4 (definition rules). Citation: https://en.wikipedia.org/wiki/ISO/IEC_11179, https://www.iso.org/standard/50340.html","output_format":"ISO/IEC 11179-3-aligned data dictionary (JSON/Markdown): one row per entity.field with Identifier, Name, Definition, Datatype (Value Domain), Permissible Values, plus an ER entity list","completeness":"skeleton-now","sections":[{"section":"Data Element / Entity inventory (the entity types)","populated_by":"Data entities from AST struct/type walk (SymbolMeta Kind in {struct,type,class})","extraction":"Filter Index.Metadata to struct/type/class kinds; each becomes an ISO 11179 entity/object class; Name from SymbolMeta.Name. Materialized now.","required":true,"fillable_now":"yes"},{"section":"Data Element name / Identifier (per field)","populated_by":"NOT emitted (verified)","extraction":"CORRECTED (was 'partial' -> now 'no'): walkForSymbols only recurses into struct/class bodies for METHODS, not fields; field_declaration is not a symbol-emitting kind (countFieldsRecursive only COUNTS for the long-struct rule). No per-field symbol exists. A field-level emission pass is needs-build.","required":true,"fillable_now":"no"},{"section":"Value Domain / Datatype (representation of each field)","populated_by":"NOT materialized","extraction":"The field type token is reachable in the AST but SymbolMeta has no field-type attribute and no field symbol is emitted. Needs a field-level extraction pass.","required":true,"fillable_now":"no"},{"section":"Serialization mapping (json/proto/avro wire name per field)","populated_by":"NOT extracted (verified gap)","extraction":"No struct-tag / json:/proto/avro serialization-tag extraction exists anywhere in internal/; SymbolMeta carries no tag field. This is the document's central promised feature and it is currently unfillable; a struct-tag parse pass is needs-build.","required":true,"fillable_now":"no"},{"section":"Permissible Values / Conceptual Domain (enums, code lists)","populated_by":"SymbolMeta Kind == enum (type name only)","extraction":"Enum symbols give the enumerated TYPE name; individual member values require the same field-level walk that is not materialized. Partial.","required":false,"fillable_now":"partial"},{"section":"Definition (ISO 11179-4 single-statement definition per element)","populated_by":"Glossary/atlas enricher as a SEED only","extraction":"Atlas maps a field keyword->term->domain to suggest a gloss, but a conformant single-statement definition is human-authored (no LLM in hot path).","required":true,"fillable_now":"no"},{"section":"Relationships between entities (ER associations / foreign keys)","populated_by":"NONE","extraction":"Entity-to-entity relationships need resolved type references / data-flow direction, explicitly NOT available.","required":false,"fillable_now":"no"},{"section":"Data-dictionary serializer/writer","populated_by":"NOT built","extraction":"No dictionary emitter exists; even the entity inventory needs a writer built.","required":true,"fillable_now":"no"}],"gaps":["Field identifier per field -> build (CORRECTED from partial: walkForSymbols emits no field symbols; field-emission pass needed)","Field datatype (Value Domain) -> build (SymbolMeta has no field-type attribute)","Serialization tags (json/proto/avro) -> build (VERIFIED absent; no struct-tag parsing exists \u2014 the document's central feature is unfillable today)","Enum member values -> build (field-level walk); ISO 11179-4 definitions -> human","Entity relationships -> build (resolved type references, not available). Honest now-state: an entity (struct/type) inventory with NAMES ONLY; fields/datatypes/serialization are all 'no'"]}]};
const DOCS = BP.documents;

const COMP = { "complete-now": "#30a46c", "near-complete": "#f5a623", "skeleton-now": "#8b8d98" };
const FILL = { yes: "#30a46c", partial: "#f5a623", no: "#e5484d" };

function SectionNode({ data }) {
  const c = FILL[data.fill] || "#8b8d98";
  return html`<div style=${{
    background: "#16181d", border: "1px solid #2a2d35", borderLeft: "4px solid " + c,
    borderRadius: 8, padding: "8px 12px", width: 300, color: "#e6e6e6",
    boxShadow: "0 2px 10px #0006", cursor: "pointer" }}>
    <${Handle} type="target" position=${Position.Left} style=${{ background: c }} />
    <div style=${{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.3 }}>${data.label}</div>
    <div style=${{ fontSize: 10.5, opacity: 0.62, marginTop: 3 }}>${data.sub}</div>
    <div style=${{ fontSize: 9.5, color: c, marginTop: 4, textTransform: "uppercase", letterSpacing: 0.5 }}>
      ${data.fill === "yes" ? "fillable now" : data.fill === "partial" ? "partial" : "gap"}${data.required ? " · required" : ""}
    </div>
  </div>`;
}
function DocNode({ data }) {
  const c = COMP[data.completeness] || "#8b8d98";
  return html`<div style=${{
    background: "#0e0f13", border: "2px solid " + c, borderRadius: 12, padding: "12px 16px",
    width: 260, color: "#fff", boxShadow: "0 4px 20px #0008" }}>
    <div style=${{ fontSize: 15, fontWeight: 700 }}>${data.label}</div>
    <div style=${{ fontSize: 11, color: c, marginTop: 4, fontWeight: 600 }}>${data.completeness}</div>
    <div style=${{ fontSize: 10.5, opacity: 0.6, marginTop: 6 }}>${data.fmt}</div>
    <${Handle} type="source" position=${Position.Right} style=${{ background: c }} />
  </div>`;
}
const nodeTypes = { section: SectionNode, doc: DocNode };

function App() {
  const [idx, setIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const doc = DOCS[idx];
  const { nodes, edges } = useMemo(() => {
    const secs = doc.sections || [];
    const h = Math.max(secs.length * 96, 200);
    const ns = [{ id: "doc", type: "doc", position: { x: 0, y: h / 2 - 40 },
      data: { label: doc.document, completeness: doc.completeness, fmt: doc.output_format } }];
    const es = [];
    secs.forEach((s, i) => {
      ns.push({ id: "s" + i, type: "section", position: { x: 420, y: i * 96 },
        data: { label: s.section, sub: s.populated_by, fill: s.fillable_now, required: s.required } });
      es.push({ id: "e" + i, source: "doc", target: "s" + i, animated: s.fillable_now === "yes",
        style: { stroke: FILL[s.fillable_now] || "#8b8d98", strokeWidth: 1.8 } });
    });
    return { nodes: ns, edges: es };
  }, [idx]);

  const onNodeClick = useCallback((_, n) => {
    if (n.type === "section") setSel(doc.sections[parseInt(n.id.slice(1))]);
  }, [idx]);

  const counts = (d) => {
    const s = d.sections || []; const y = s.filter(x => x.fillable_now === "yes").length;
    return y + "/" + s.length;
  };

  return html`<div style=${{ display: "flex", height: "100vh", font: "13px ui-monospace,Menlo,monospace", background: "#0a0b0e", color: "#e6e6e6" }}>
    <div style=${{ width: 280, borderRight: "1px solid #1d2026", overflowY: "auto", flexShrink: 0 }}>
      <div style=${{ padding: "14px 16px", borderBottom: "1px solid #1d2026", position: "sticky", top: 0, background: "#0a0b0e" }}>
        <div style=${{ fontSize: 14, fontWeight: 700 }}>Document Construction</div>
        <div style=${{ fontSize: 11, opacity: 0.55, marginTop: 2 }}>${DOCS.length} documents · fillable-now / total</div>
      </div>
      ${DOCS.map((d, i) => html`<div key=${i} onClick=${() => { setIdx(i); setSel(null); }} style=${{
        padding: "10px 16px", borderBottom: "1px solid #15171c", cursor: "pointer",
        background: i === idx ? "#16181d" : "transparent" }}>
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style=${{ fontSize: 12.5, fontWeight: i === idx ? 700 : 500 }}>${d.document}</span>
          <span style=${{ fontSize: 10.5, opacity: 0.6 }}>${counts(d)}</span>
        </div>
        <span style=${{ fontSize: 10, color: COMP[d.completeness], fontWeight: 600 }}>${d.completeness}</span>
      </div>`)}
    </div>
    <div style=${{ flex: 1, position: "relative" }}>
      <${ReactFlow} nodes=${nodes} edges=${edges} nodeTypes=${nodeTypes} onNodeClick=${onNodeClick}
        fitView minZoom=${0.2} proOptions=${{ hideAttribution: true }}>
        <${Background} color="#1a1d24" gap=${22} />
        <${Controls} />
        <${MiniMap} pannable zoomable style=${{ background: "#0e0f13" }}
          nodeColor=${(n) => n.type === "doc" ? COMP[doc.completeness] : (FILL[n.data.fill] || "#555")} />
      <//>
    </div>
    <div style=${{ width: 330, borderLeft: "1px solid #1d2026", padding: 16, overflowY: "auto", flexShrink: 0 }}>
      <div style=${{ fontSize: 14, fontWeight: 700 }}>${doc.document}</div>
      <div style=${{ fontSize: 11, color: COMP[doc.completeness], fontWeight: 600, margin: "2px 0 10px" }}>${doc.completeness}</div>
      <div style=${{ fontSize: 11, opacity: 0.8, marginBottom: 4 }}><b>Standard</b></div>
      <div style=${{ fontSize: 11, opacity: 0.65, marginBottom: 10, lineHeight: 1.4 }}>${doc.standard}</div>
      <div style=${{ fontSize: 11, opacity: 0.8, marginBottom: 4 }}><b>Output</b></div>
      <div style=${{ fontSize: 11, opacity: 0.65, marginBottom: 10 }}>${doc.output_format}</div>
      ${(doc.gaps && doc.gaps.length) ? html`<div style=${{ fontSize: 11, opacity: 0.8, marginBottom: 4 }}><b style=${{ color: "#e5484d" }}>Gaps</b></div>
        <ul style=${{ margin: "0 0 12px", paddingLeft: 16 }}>${doc.gaps.map((g, i) => html`<li key=${i} style=${{ fontSize: 10.5, opacity: 0.7, marginBottom: 3 }}>${g}</li>`)}</ul>` : null}
      ${sel ? html`<div style=${{ borderTop: "1px solid #1d2026", paddingTop: 10 }}>
        <div style=${{ fontSize: 11, color: FILL[sel.fillable_now], fontWeight: 700, marginBottom: 4 }}>${sel.section}</div>
        <div style=${{ fontSize: 10.5, opacity: 0.65, marginBottom: 6 }}><b>From:</b> ${sel.populated_by}</div>
        <div style=${{ fontSize: 10.5, opacity: 0.65 }}><b>How:</b> ${sel.extraction}</div>
      </div>` : html`<div style=${{ fontSize: 10.5, opacity: 0.4, borderTop: "1px solid #1d2026", paddingTop: 10 }}>Click a section node for its extraction method.</div>`}
    </div>
  </div>`;
}
createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body></html>
