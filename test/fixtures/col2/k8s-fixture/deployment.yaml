apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-web
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: web
          image: fixture/web:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-web-svc
spec:
  selector:
    app: fixture-web
  ports:
    - port: 80
      targetPort: 8080
